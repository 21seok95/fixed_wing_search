<svg width="680" height="440" viewBox="0 0 680 440" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif">
  <title>사각형 단위 RL의 3층 구조</title>
  <desc>관측이 공유 CNN으로 들어가고, 정책이 위치, 모양, 시작 방법을 순서대로 고른다. 분리 검사기를 거친 사각형을 기존 비행 코드가 5초마다 방향 명령으로 비행하고, 이 사각형이 더한 POS가 보상으로 돌아온다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/>

  <rect x="90" y="24" width="500" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">관측: 결정 시점마다 지도와 벡터</text>
  <text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">확률(현재와 미래), 다른 UAV의 작업 경로</text>
  <line x1="340" y1="80" x2="340" y2="100" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="102" width="500" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="120" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">공유 CNN과 픽셀 출력</text>
  <text x="340" y="140" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">기존 MultiMapExtractor + 업샘플 층</text>
  <line x1="165" y1="158" x2="165" y2="178" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="180" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="165" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">1. 어디</text>
  <text x="165" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">지도 픽셀 하나</text>
  <line x1="240" y1="208" x2="263" y2="208" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="265" y="180" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">2. 어떤 모양</text>
  <text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">각도, 길이, k</text>
  <line x1="415" y1="208" x2="438" y2="208" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="440" y="180" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="515" y="198" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">3. 어떻게 시작</text>
  <text x="515" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">모서리, 대기</text>
  <line x1="515" y1="236" x2="515" y2="256" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="258" width="500" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="276" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">분리 검사기</text>
  <text x="340" y="296" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">위반하는 모서리와 대기 조합은 3번에서 미리 제외</text>
  <line x1="340" y1="314" x2="340" y2="334" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="90" y="336" width="500" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="354" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">기존 비행 코드</text>
  <text x="340" y="374" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">lanes, FramedFollower: 5초마다 방향 명령</text>

  <path d="M590 364 L630 364 L630 130 L592 130" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="418" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">보라: 학습, 청록: 기존 규칙 코드, 오른쪽 화살표: 보상(이 사각형이 더한 POS)</text>
</svg>
